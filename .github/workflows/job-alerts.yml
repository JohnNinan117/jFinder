name: jFinder Discord alerts

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "America/Toronto"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Discord test message instead of scraping"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jfinder-job-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out jFinder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send test notification
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py --test

      - name: Find and notify new jobs
        if: github.event_name == 'schedule' || !inputs.test_notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py

      - name: Save job history
        if: github.event_name == 'schedule' || !inputs.test_notification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update jFinder job history [skip ci]"
            git push
          fi
